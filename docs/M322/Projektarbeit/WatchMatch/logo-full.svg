<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160">
  <!-- Icon Skaliert & Positioniert -->
  <g transform="translate(15, 12) scale(0.26)">
    <!-- Hintere Karte (Primär #D80B69) -->
    <g transform="rotate(12 300 260)">
      <rect x="210" y="110" width="170" height="280" rx="20" fill="#D80B69" />
      <rect x="350" y="130" width="16" height="16" rx="4" fill="#0A0A0A" opacity="0.4" />
      <rect x="350" y="165" width="16" height="16" rx="4" fill="#0A0A0A" opacity="0.4" />
      <rect x="350" y="200" width="16" height="16" rx="4" fill="#0A0A0A" opacity="0.4" />
      <rect x="350" y="235" width="16" height="16" rx="4" fill="#0A0A0A" opacity="0.4" />
      <rect x="350" y="270" width="16" height="16" rx="4" fill="#0A0A0A" opacity="0.4" />
      <rect x="350" y="305" width="16" height="16" rx="4" fill="#0A0A0A" opacity="0.4" />
      <rect x="350" y="340" width="16" height="16" rx="4" fill="#0A0A0A" opacity="0.4" />
    </g>

    <!-- Vordere Karte (Tertiär #2A2A2A + Accent #FFD405 Border) -->
