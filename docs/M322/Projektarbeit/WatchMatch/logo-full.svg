      <rect x="125" y="110" width="170" height="280" rx="20" fill="#2A2A2A" stroke="#FFD405" stroke-width="12" />
      
      <!-- Perforationen links -->
      <rect x="142" y="130" width="16" height="16" rx="4" fill="#FFD405" />
      <rect x="142" y="165" width="16" height="16" rx="4" fill="#FFD405" />
      <rect x="142" y="200" width="16" height="16" rx="4" fill="#FFD405" />
      <rect x="142" y="235" width="16" height="16" rx="4" fill="#FFD405" />
      <rect x="142" y="270" width="16" height="16" rx="4" fill="#FFD405" />
      <rect x="142" y="305" width="16" height="16" rx="4" fill="#FFD405" />
      <rect x="142" y="340" width="16" height="16" rx="4" fill="#FFD405" />

      <!-- Perforationen rechts -->
      <rect x="262" y="130" width="16" height="16" rx="4" fill="#FFD405" />
      <rect x="262" y="165" width="16" height="16" rx="4" fill="#FFD405" />
      <rect x="262" y="200" width="16" height="16" rx="4" fill="#FFD405" />
      <rect x="262" y="235" width="16" height="16" rx="4" fill="#FFD405" />
      <rect x="262" y="270" width="16" height="16" rx="4" fill="#FFD405" />
      <rect x="262" y="305" width="16" height="16" rx="4" fill="#FFD405" />
      <rect x="262" y="340" width="16" height="16" rx="4" fill="#FFD405" />

