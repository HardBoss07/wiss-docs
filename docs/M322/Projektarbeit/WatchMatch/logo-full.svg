  <!-- Typografie: WatchMatch. -->
  <text x="165" y="98" font-family="&#39;Roboto&#39;, system-ui, -apple-system, sans-serif" font-size="58" font-weight="700" letter-spacing="-0.5">
    <tspan fill="#FFFFFF">Watch</tspan><tspan fill="#D80B69">Match</tspan><tspan fill="#FFD405">.</tspan>
  </text>
