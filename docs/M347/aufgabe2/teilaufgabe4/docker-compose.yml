services:
  web:
    build: .
    ports:
      - '8083:80'
    volumes:
      - ./index.php:/var/www/html/index.php
    environment:
      DB_HOST: db
      DB_NAME: app_db
      DB_USER: user
      DB_PASSWORD: password

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: app_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
